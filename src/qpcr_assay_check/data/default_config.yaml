# qpcr-assay-check: default configuration (schema_version 1)
#
# Every value below is a STARTING POINT taken from common TaqMan design guidance,
# not an acceptance criterion. Each laboratory must review the thresholds against its own
# quality system. Override any value by passing your own YAML file with --config; only the
# keys you give are changed, everything else keeps the defaults shown here.
#
# NCBI credentials are NEVER read from this file: use the NCBI_EMAIL and NCBI_API_KEY
# environment variables (introduced in v0.2.0).

schema_version: 1

reaction:
  # Conditions used for melting temperatures and structure calculations (primer3 conventions).
  na_mM: 50.0            # monovalent cations
  mg_mM: 3.0             # free Mg2+
  dntp_mM: 0.8
  primer_nM: 400.0
  probe_nM: 200.0
  annealing_temp_C: 60.0 # annealing/extension temperature of the cycling protocol
  tm_method: santalucia          # santalucia | breslauer
  salt_correction: santalucia    # santalucia | owczarzy | schildkraut

oligo:
  max_degenerate_expansions: 64  # per oligo; larger degenerate oligos are rejected
  max_pair_combinations: 256     # variant combinations evaluated per oligo pair (dimers)

thresholds:
  # Bands: PASS inside pass_range, FAIL outside fail_range, WARN in between.
  primer:
    length_nt: {pass_range: [18, 30], fail_range: [15, 40]}
    gc_percent: {pass_range: [40, 60], fail_range: [30, 70]}
    # Tm from primer3 (SantaLucia) runs a few degrees higher than vendor calculators.
    tm_c: {pass_range: [58.0, 66.0], fail_range: [54.0, 70.0]}
    gc_in_last5: {min: 1, max: 3}            # G/C among the last 5 nt at the 3' end; else WARN
    max_run: {warn_at: 5, fail_at: 7}        # longest single-base run (nt)
    max_g_run: {warn_at: 4, fail_at: 6}      # longest run of G (nt)
  probe:
    length_nt: {pass_range: [15, 30], fail_range: [12, 40]}
    gc_percent: {pass_range: [30, 80], fail_range: [20, 90]}
    tm_minus_mean_primer_c: {pass_range: [5.0, 12.0], fail_range: [0.0, 15.0]}
    max_run: {warn_at: 5, fail_at: 7}
    max_g_run: {warn_at: 4, fail_at: 6}
    warn_if_more_g_than_c: true
    g_sensitive_reporters: [FAM, FITC]       # a 5' G next to these dyes quenches the signal
  pair:
    primer_tm_diff_c: {warn_above: 3.0, fail_above: 6.0}
  structures:
    # Structure melting temperature, evaluated against the annealing temperature.
    # 47 C is the default limit Primer3 uses for hairpins and dimers.
    warn_tm_c: 47.0
    fail_tm_c: null                          # null = the annealing temperature
  amplicon:
    length_bp: {pass_range: [50, 150], fail_range: [40, 300]}
    gc_percent: {pass_range: [35, 65], fail_range: [25, 75]}
    allow_probe_primer_overlap: false
    max_site_mismatches: 2                   # tolerated when locating oligos in the amplicon

ncbi:
  # NCBI credentials are NEVER read from configuration: use the NCBI_EMAIL (required for any
  # network use) and NCBI_API_KEY (optional) environment variables.
  tool: qpcr-assay-check
  blast_url: https://blast.ncbi.nlm.nih.gov/Blast.cgi
  eutils_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  request_timeout_s: 120
  max_retries: 5
  backoff_base_s: 2.0              # exponential: 2, 4, 8, ... seconds (plus jitter)
  blast_min_interval_s: 10         # NCBI: contact the BLAST server at most once per 10 s
  poll_interval_s: 60              # NCBI: poll a given RID at most once per minute
  max_wait_minutes: 240            # give up waiting (the job stays resumable); a human search took 61 min
  resubmit_after_minutes: 90       # a search resumed in a later run that has been WAITING this
                                   #   long since submission is submitted anew (once per run);
                                   #   `run/search --resubmit` does so at once
  rid_lifetime_hours: 36           # NCBI keeps results for about 36 h; older jobs are resubmitted
  blast_cache_ttl_days: 7          # BLAST results are only reused within a run / a resume
  taxonomy_cache_ttl_days: 30
  cache_dir: null                  # null = per-user cache directory
  datasets_url: https://api.ncbi.nlm.nih.gov/datasets/v2   # NCBI Datasets v2 (published OpenAPI spec)
  datasets_batch_size: 20          # assemblies per genome download request (API maximum: 100)

search:
  # Short-oligo BLAST settings (see docs/ARCHITECTURE.md for the NCBI documentation they follow).
  program: blastn
  database: core_nt
  word_size: 7
  expect: 1000
  filter: "F"                      # low-complexity filtering off
  reward: 1
  penalty: -3
  gap_open: 5                      # assumed valid with reward 1 / penalty -3 (smoke test checks)
  gap_extend: 2
  hitlist_size: 5000               # maximum via the URL API is unverified; the smoke test checks it
  result_format: JSON2_S
  max_taxids_per_search: 20        # conservative until the smoke test verifies the real limit
  max_searches_warn: 50            # NCBI asks for off-peak scheduling above this
  background_taxids: [9606]        # human; add your own background taxa
  relevance:
    min_identical_bases: 14        # a hit with fewer identical bases is not a relevant off-target

specificity:
  # Assessment of BLAST hits: full-length re-alignment, site classification, amplicon pairing.
  # ALL of these are starting points, not acceptance criteria: review them for your laboratory.
  off_target_tiers: [near_neighbours, background, exclusivity]  # off-target by construction
  max_sites_per_query: 2000        # strongest hits first; beyond this the assessment is INCOMPLETE
  window_padding_nt: 10            # subject bases fetched beyond a partial hit, to allow gaps
  max_amplicon_size: 2000          # predicted products longer than this are ignored
  max_amplicons: 500               # safety cap for repetitive regions
  report_top_sites: 25             # alignments shown in the HTML report
  alignment: {match: 1, mismatch: -3, gap_open: 5, gap_extend: 2}
  # A primer site is CRITICAL when it has at most this many mismatches AND gaps and this many
  # clean (perfectly matching) nucleotides at the 3' end; WARNING with the looser limits.
  primer_site:
    critical: {max_mismatches: 3, max_gaps: 0, min_clean_3prime_nt: 5}
    warning: {max_mismatches: 5, max_gaps: 1, min_clean_3prime_nt: 3}
  probe_site:
    critical: {max_mismatches: 3, max_gaps: 0, min_clean_3prime_nt: 0}
    warning: {max_mismatches: 5, max_gaps: 1, min_clean_3prime_nt: 0}
  probe_binds_if: critical         # site level the probe needs for an amplicon to be 'likely detected'
  severity:                        # verdict contribution of each finding: FAIL | WARN | INFO
    primer_site_critical: FAIL     # a critical primer site that is part of a predicted product
    primer_site_critical_no_product: WARN  # ... that forms no predicted product (no facing
                                   #   partner): off-target priming, not a product
    primer_site_warning: WARN
    probe_site_critical: INFO      # a probe site alone cannot make a product: the probe signals
                                   #   only inside one (see amplicon_*); advisor 2026-09-25
    amplicon_likely_detected: FAIL
    amplicon_not_detected: WARN
  eukaryote_taxids: [9606]         # organisms for which genomic-DNA hits matter to RNA assays
  # Partner scan: next to every off-target primer site that can prime and forms no product, the
  # sequence a product could span (max_amplicon_size) is fetched and the partner primers are
  # aligned in it; probes are re-aligned inside products without a probe site. A partner or
  # probe site BLAST did not report (score below the E-value cut-off) is still found. At most
  # this many fetches per run, partner windows first, then products (cached; beyond: the
  # result is INCOMPLETE); 0 switches the scan off.
  partner_scan_max_windows: 1000

organisms:
  # The clinical organism list used for the 'exclusivity' search tier and report table.
  source: assay                    # assay = use the assay.yaml's own 'exclusivity_organisms' list
                                    #   when it defines one (a panel tailored to that assay's own
                                    #   target); falls back to the global list below for any assay
                                    #   that leaves 'exclusivity_organisms' empty, so this is safe
                                    #   to leave as the default even before every assay has its own
                                    #   list.
                                    # global = always use the list below, ignoring any per-assay
                                    #   'exclusivity_organisms', even if the assay defines one.
  list_file: null                  # null = packaged starter list (data/clinical_organisms.yaml);
                                    # a STARTING POINT only (see that file's own header) -- give
                                    # your own path to replace it with your laboratory's own list.
                                    # Used when 'source: global', or as the fallback under
                                    # 'source: assay' for an assay with no list of its own.
  resolve_synonyms: true            # also try Entrez's [All Names] when [Scientific Name] finds
                                     # nothing (taxonomic renames, e.g. Mycoplasma -> Mycoplasmoides)

inclusivity:
  # How well the oligos still match the intended target, over time: built from the exhaustive
  # variant analysis (every genome of the target), bucketed by release year. ALL of these are
  # starting points, not acceptance criteria.
  lookback_years: 10               # how many years back from today to report (0 records is a
                                    # valid, honestly-reported answer for an early year, not skipped)
  warn_below_percent: 95           # % of genomes detected (0-1 mismatch, no 3' mismatch)
  fail_below_percent: 80           # below this, WARN/FAIL: applied to the whole-fragment genome
                                    # outcome over the verdict window below
  verdict_window_years: 3          # exhaustive: the last N complete release years + this year
  min_genomes_for_verdict: 100     # fewer genomes with the region in the window: INCOMPLETE
  min_genomes_per_year: 30         # a single year with at least this many genomes below
                                    # fail_below_percent inside the window gives WARN when the
                                    # pooled figure passes ("release year <year> on its own");
                                    # smaller years are marked "few records" and only shown
  max_undetermined_percent: 25     # more undetermined genomes than this share of those with the
                                    # region (whole fragment over the window; a channel over all
                                    # genomes): INCOMPLETE, not a percentage status. The report
                                    # also gives the figure if all undetermined were escapes and
                                    # if all were detected. Your laboratory's choice.
  limits_need_complete_coverage: true   # while genomes or records are still to assess, an
                                    # Exceeds limit is held back to Incomplete and the sentence
                                    # says what it would have been. The newest are assessed
                                    # first, so a partial run is weighted to the most recent year
                                    # and a figure can cross a limit and cross back. false: file
                                    # the Exceeds limit on the genomes assessed so far. A Review
                                    # and a no-flags figure wait either way (missing evidence is
                                    # never "no flags"), per oligo and per probe channel too.
  status_axis: release             # which year groups the genomes for the status window:
                                    # release (NCBI release year) or collection (the year the
                                    # sample was collected, as its submitter recorded it). The
                                    # other axis is shown as information; with collection,
                                    # genomes without a usable date are left out and counted.

variants:
  # Exhaustive variant analysis of the intended target: the variant summary and inclusivity are
  # built from EVERY genome assembly of the target taxon in NCBI Datasets (complete and draft),
  # not from BLAST's best hits. Each genome is downloaded, scanned for the reference amplicon and
  # discarded; only the amplicon region plus flanks is kept (cached, so later runs only process
  # assemblies that are new). Needs the reference amplicon (assay 'reference_amplicon', or found
  # via the oligos in the target 'accession').
  source: datasets                 # datasets: every genome assembly (bacteria, most targets)
                                   # blast_partitioned: every NCBI Nucleotide record, BLASTed in
                                   #   accession lists (targets without assemblies, e.g. viruses
                                   #   or single genes; sends the reference amplicon to BLAST)
  current_assemblies_only: true    # the latest version of each assembly
  exclude_atypical: true           # NCBI's "atypical" flag (assembly problems)
  max_assemblies_per_run: 20000    # newest first; the rest follow on later runs (resumable)
  flank_nt: 50                     # bases kept on each side of the amplicon
  seed_length: 16                  # exact k-mers of the reference fragment used to find it
  seed_step: 2                     #   (every 2nd position, both strands; measured 2026-09-29:
                                   #   every 4th missed divergent opa copies, every 2nd did not)
  # blast_partitioned only:
  nucleotide_query: null           # extra Entrez filter for the record list, e.g. "25000:32000[SLEN]"
  blast_max_records_per_run: 2000  # newest first; one BLAST search per blast_records_per_search
  blast_records_per_search: 100    # accessions per search (100 checked live; the maximum here)
  direct_scan_max_length: 200000   # records BLAST did not hit and at most this long are fetched
                                   #   and scanned directly (newest records may not be in BLAST yet)
  direct_scan_batch: 20            # records per EFetch request for that direct scan
  probe_channels: any              # probes with different reporters are separate channels:
                                   #   any = a genome counts as detected if any channel detects it
                                   #   all = only if every channel does
  homopolymer_bulges_detectable: false  # a site differing only by the length of a single-base
                                   #   run (e.g. poly-A 7->8), without any mismatch: false =
                                   #   its class decides (primers: rule R5b, at risk or likely
                                   #   failure); true = detectable. The report shows the count
                                   #   under both rules either way
  multicopy_unassembled: auto      # multi-copy targets: a draft genome (Scaffold/Contig, more
                                   #   than one sequence or a copy cut at a contig end) whose best
                                   #   copy fails, with fewer than half the copies of the complete
                                   #   and chromosome-level genomes of the run (median; at least 5
                                   #   of them, median 2 or more), counts as undetermined "copies
                                   #   possibly unassembled" unless one of those fails the same
                                   #   way (also in the panel command);
  # A located region counts as a copy of the locus when ANY of (a), (b), (c) holds; weaker
  # regions are listed, never judged. Measured (2026-09-28/29): chance regions reach at most 18
  # anchored bases and identity 0.54-0.60; true copies of a divergent species 114+ bases.
  min_anchored_bases: 32           # (a) fragment bases in exact blocks, in order
  min_context_bases: 32            # (b) bases anchored in the sequence on one side of the
                                   #   fragment (context accession), with the fragment touched,
                                   #   flanked on both sides, or cut by a contig end
  min_copy_identity: 0.75          # (c) identity to the reference fragment over the part the
                                   #   copy covers (e.g. the divergent N. gonorrhoeae opa copy:
                                   #   0.80) ...
  min_identity_anchored_bases: 16  #   ... with at least this many fragment bases anchored
  max_indel: 150                   # largest length difference to the reference within one copy
  judge_from_parts: detectable     # genomes whose copies are cut by a contig end (e.g. rRNA
                                   #   operons in draft assemblies) but that carry a detectable
                                   #   site of every role on the cut copies (2+ exact seeds each):
                                   #   detectable = counted as detected (default since 2026-10-01,
                                   #   user: every site was seen whole); undetermined = its own
                                   #   class "detectable from parts", counted as undetermined;
                                   #   off = "cut by a contig end" (undetermined). The sites may
                                   #   come from different copies, so this is never proof of one
                                   #   amplicon
                                   #   off = counted as an escape

report:
  include_charts: true                       # oligo Tm chart (inline SVG, a few kB)
