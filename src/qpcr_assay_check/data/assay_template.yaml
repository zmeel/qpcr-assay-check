# qpcr-assay-check: assay file template with every option explained (v1.3.0)
#
# Copy this file, fill in the REQUIRED fields and delete what you do not need. Only
# assay_name, forward, reverse, probe and target are required; everything else is optional.
# Check the file with:   qpcr-assay-check validate my_assay.yaml
# Run it with:           qpcr-assay-check run my_assay.yaml -o results -y
#
# Sequences: 5'->3', written as DNA (T, not U), also for RNA targets. IUPAC ambiguity codes
# (R, Y, S, W, K, M, B, D, H, V, N) are allowed: a degenerate oligo is expanded into all its
# variants (at most settings.oligo.max_degenerate_expansions). Dye, quencher and modification
# names never go inside a sequence. 10-60 nt per oligo.
#
# The NCBI email and API key are never written here: set NCBI_EMAIL (required) and NCBI_API_KEY
# (optional, allows faster requests) as environment variables.

# --------------------------------------------------------------------------------- the assay
assay_name: ""              # REQUIRED. Free text; also names the results folder.

# Oligos. Each role (forward, reverse, probe) takes ONE of three forms:
#   1. a plain sequence:            forward: GACCCCAAAATCAGCGAAAT
#                                   (the oligo is then simply called "forward")
#   2. one named oligo:             forward: {name: F1, sequence: GACCCCAAAATCAGCGAAAT}
#   3. several named oligos, as a list (see probe below). Several oligos of one role are
#      ALTERNATIVES IN THE SAME REACTION MIX, e.g. a second forward primer for a lineage a
#      wobble base cannot bridge: for each genome/record the best-binding one counts.
# Names: letters, digits, '.', '_' or '-', at most 40 characters, unique within the assay, not
# ending in '_v' + a number (reserved for degenerate variants). They appear in the report, the
# workbook, hits.tsv and as BLAST query labels.
forward: ""                 # REQUIRED
reverse: ""                 # REQUIRED. The primer as ordered (5'->3'), not its binding site.
probe: ""                   # REQUIRED
# probe:                    # the list form, with per-probe dye information:
#   - name: P1
#     sequence: ""
#     reporter: FAM         # optional; else probe_reporter below
#     quencher: BHQ1        # optional; else probe_quencher below
#     modifications: [MGB]  # optional; else probe_modifications below
#   - name: P2
#     sequence: ""
# Probes with the SAME reporter are alternatives (e.g. for mismatches in the probe region);
# probes with DIFFERENT reporters detect different regions (separate channels).

# Defaults for probes that do not name their own dye information:
probe_reporter: FAM         # a 5' G next to FAM-type dyes quenches the signal (QC check)
probe_quencher: BHQ1
probe_modifications: []     # e.g. [MGB], [LNA], [ZEN]. Any entry triggers a "Tm reliability"
                            #   warning: nearest-neighbour Tm does not model modifications.

template_type: DNA          # DNA | RNA. RNA means a reverse-transcription step; genomic-DNA
                            #   off-target products in eukaryotes are then flagged separately.

target:                     # REQUIRED: at least a taxonomy ID or a reference accession
  taxid:                    # NCBI Taxonomy ID of the intended target, e.g. 485 (N. gonorrhoeae).
                            #   Needed for the target search, inclusivity and variant analysis.
  accession:                # a reference record, e.g. NC_045512.2. Used to cut the reference
                            #   amplicon when none is given below, and to find a region that is
                            #   wholly hidden by N in low-coverage genomes.
  gene:                     # free text, for the report only

# Reference amplicon: the sense-strand sequence the primers amplify (primer sites included; a
# little flanking sequence is fine). Enables the amplicon QC (length, GC, probe position) and is
# what the variant analysis searches for in every genome. Give ONE of the two forms:
# reference_amplicon: ""
# reference_amplicons:      # several, one per lineage; each oligo is placed in the one it fits
#   - name: lineage-A       #   best (the variant analysis uses the first one until v1.3.0 step 2)
#     sequence: ""
#   - name: lineage-B
#     sequence: ""

# Off-target search tiers besides the global background (settings.search.background_taxids):
near_neighbour_taxids: []   # close relatives the assay must NOT detect, as taxonomy IDs;
exclusion_taxids: []        #   both lists are searched together as the "near neighbours" tier
exclusivity_organisms: []   # this assay's own exclusivity panel, as organism NAMES, e.g.
                            #   [Neisseria meningitidis, Neisseria lactamica]. Resolved to
                            #   taxonomy IDs at NCBI. Empty = the global starter list (see
                            #   settings.organisms). The assay's own target is always left out.

oligo_source: ""            # where the sequences come from (publication, kit insert, in-house);
                            #   printed in the report
notes: ""                   # free text, printed in the report

# ------------------------------------------------------------------------------ settings
# This assay's own settings: the same structure as config.yaml, applied over the built-in
# defaults and over any lab-wide --config file. Every option below is commented out and shows
# its DEFAULT. To change one, delete only the '# ' in front of it (keep the indentation) and edit
# the value. Leave the section names (reaction:, search:, ...) as they are: a section with only
# commented options changes nothing. 'ncbi' and 'report' are lab-wide and cannot be set here.
# The report's Methods section lists every setting taken from this file.
settings:

  reaction:                 # conditions for Tm and secondary-structure calculations
    # na_mM: 50.0               # monovalent cations (mM)
    # mg_mM: 3.0                # free Mg2+ (mM)
    # dntp_mM: 0.8              # dNTP (mM)
    # primer_nM: 400.0          # primer concentration in the reaction
    # probe_nM: 200.0           # probe concentration in the reaction
    # annealing_temp_C: 60.0    # annealing/extension temperature of the cycling protocol
    # tm_method: santalucia     # santalucia | breslauer
    # salt_correction: santalucia   # santalucia | owczarzy | schildkraut

  oligo:
    # max_degenerate_expansions: 64   # per oligo; a more degenerate oligo is rejected
    # max_pair_combinations: 256      # variant combinations checked per oligo pair (dimers)

  thresholds:               # QC bands: PASS inside pass_range, FAIL outside fail_range, else WARN.
                            # Starting points from common TaqMan guidance, not acceptance criteria.
    primer:
      # length_nt: {pass_range: [18, 30], fail_range: [15, 40]}
      # gc_percent: {pass_range: [40, 60], fail_range: [30, 70]}
      # tm_c: {pass_range: [58.0, 66.0], fail_range: [54.0, 70.0]}   # primer3 (SantaLucia) Tm runs
      #                                                               # a few degrees above vendor tools
      # gc_in_last5: {min: 1, max: 3}      # G/C among the last 5 nt at the 3' end; else WARN
      # max_run: {warn_at: 5, fail_at: 7}  # longest single-base run (nt)
      # max_g_run: {warn_at: 4, fail_at: 6}
    probe:
      # length_nt: {pass_range: [15, 30], fail_range: [12, 40]}
      # gc_percent: {pass_range: [30, 80], fail_range: [20, 90]}
      # tm_minus_mean_primer_c: {pass_range: [5.0, 12.0], fail_range: [0.0, 15.0]}
      # max_run: {warn_at: 5, fail_at: 7}
      # max_g_run: {warn_at: 4, fail_at: 6}
      # warn_if_more_g_than_c: true
      # g_sensitive_reporters: [FAM, FITC] # a 5' G next to these dyes quenches the signal
    pair:
      # primer_tm_diff_c: {warn_above: 3.0, fail_above: 6.0}   # forward vs reverse Tm
    structures:             # hairpins and dimers, judged by their Tm at the annealing temperature
      # warn_tm_c: 47.0                    # Primer3's default limit
      # fail_tm_c: null                    # null = the annealing temperature
    amplicon:
      # length_bp: {pass_range: [50, 150], fail_range: [40, 300]}
      # gc_percent: {pass_range: [35, 65], fail_range: [25, 75]}
      # allow_probe_primer_overlap: false
      # max_site_mismatches: 2             # tolerated when placing oligos in the reference amplicon

  search:                   # the remote BLAST searches (target, near neighbours, background,
                            #   exclusivity)
    # background_taxids: [9606]   # background taxa searched as off-target; [9606] = human.
    #                             #   [] skips the human search (the report then says so).
    # hitlist_size: 5000          # hits per oligo per search; a full list is reported as saturated
    # max_taxids_per_search: 20   # taxa per search before the tier is split into several
    # max_searches_warn: 50       # NCBI asks for off-peak scheduling above this many searches
    # Advanced short-oligo BLAST parameters; change only with a reason (docs/ARCHITECTURE.md):
    # program: blastn
    # database: core_nt
    # word_size: 7
    # expect: 1000
    # filter: "F"                 # low-complexity filtering off
    # reward: 1
    # penalty: -3
    # gap_open: 5
    # gap_extend: 2
    # result_format: JSON2_S
    relevance:
      # min_identical_bases: 14   # a hit with fewer identical bases is not a relevant off-target

  specificity:              # how BLAST hits are judged (full-length re-alignment, site levels,
                            #   predicted off-target products)
    # off_target_tiers: [near_neighbours, background, exclusivity]
    # max_sites_per_query: 2000   # strongest hits first; beyond this the assessment is INCOMPLETE
    # window_padding_nt: 10       # extra subject bases fetched around a partial hit (gaps)
    # max_amplicon_size: 2000     # predicted products longer than this are ignored
    # max_amplicons: 500          # safety cap for repetitive regions
    # report_top_sites: 25        # rows in the report's closest off-target table (x2, at least 40)
    # alignment: {match: 1, mismatch: -3, gap_open: 5, gap_extend: 2}
    # probe_binds_if: critical    # site level a probe needs for a product to be 'likely detected'
    # eukaryote_taxids: [9606]    # where genomic-DNA hits matter to RNA assays
    # A site is CRITICAL with at most these mismatches and gaps and at least this many
    # perfectly matching 3' nucleotides; WARNING with the looser limits:
    primer_site:
      # critical: {max_mismatches: 3, max_gaps: 0, min_clean_3prime_nt: 5}
      # warning: {max_mismatches: 5, max_gaps: 1, min_clean_3prime_nt: 3}
    probe_site:
      # critical: {max_mismatches: 3, max_gaps: 0, min_clean_3prime_nt: 0}
      # warning: {max_mismatches: 5, max_gaps: 1, min_clean_3prime_nt: 0}
    severity:               # what each finding does to the verdict: FAIL | WARN | INFO
      # primer_site_critical: FAIL
      # primer_site_warning: WARN
      # probe_site_critical: WARN         # a probe site alone cannot make a product
      # amplicon_likely_detected: FAIL
      # amplicon_not_detected: WARN

  organisms:                # the exclusivity organism list
    # source: assay           # assay = this file's exclusivity_organisms when given, else the
    #                         #   global list; global = always the global list
    # list_file: null         # null = the packaged starter list; or a path to your lab's own
    # resolve_synonyms: true  # also try Entrez [All Names] (taxonomic renames)

  inclusivity:              # how well the oligos match the intended target, per year
    # lookback_years: 10      # years back from today shown in the tables
    # sample_per_window: 20   # records per year when the variant source is blast_hits (a sample)
    # warn_below_percent: 95  # % of records at 0-1 mismatch without a 3'-end mismatch
    # fail_below_percent: 80  # the worst oligo/year decides

  variants:                 # the exhaustive variant analysis of the intended target
    # source: datasets        # datasets: every genome assembly (bacteria, most targets)
    #                         # blast_partitioned: every Nucleotide record (viruses, single genes)
    #                         # blast_hits: the target search's own BLAST hits (biased sample)
    # max_assemblies_per_run: 20000   # newest first; later runs continue (resumable). Lower it
    #                                 #   (e.g. 5000) for shorter runs; not counted as a change.
    # current_assemblies_only: true   # latest version of each assembly
    # exclude_atypical: true          # skip assemblies NCBI flags as atypical
    # flank_nt: 50                    # bases kept on each side of the amplicon
    # seed_length: 16                 # exact k-mers used to find the amplicon in a genome
    # seed_step: 4
    # blast_partitioned only:
    # nucleotide_query: null          # extra Entrez filter, e.g. "25000:32000[SLEN]" to keep only
    #                                 #   genome-length records (SARS-CoV-2 genomes are ~29.9 kb)
    # blast_max_records_per_run: 2000
    # blast_records_per_search: 100
    # direct_scan_max_length: 200000  # records up to this length are fetched and scanned directly
    # direct_scan_batch: 20
