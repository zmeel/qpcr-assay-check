# The browser interface on a NAS or server (GUI phase G1). LAN or VPN only: do not forward
# this port from the internet. Run from the folder that contains work/ (as scripts/run_assay.sh).
#
#   echo "QAC_UID=$(id -u)" >> .env; echo "QAC_GID=$(id -g)" >> .env   # once: run as you
#   docker compose build
#   docker compose run --rm gui gui set-password --work /work
#   docker compose up -d
#
# (Not UID/GID: those are read-only in some shells, e.g. the Synology shell.)
# Then open http://<nas-address>:8080. NCBI_EMAIL / NCBI_API_KEY come from .env (gitignored).
services:
  gui:
    build: .
    image: qpcr-assay-check
    command: ["gui", "serve", "--host", "0.0.0.0", "--port", "8080", "--work", "/work",
              "--examples", "/examples"]
    user: "${QAC_UID:-1000}:${QAC_GID:-1000}"  # owner of work/ (from .env)
    environment:  # read from .env in this folder (Compose substitutes them)
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
    volumes:
      - ./work:/work
      - ./docs/examples:/examples:ro   # offered for copying on the Assays page
    ports:
      - "8080:8080"
    restart: unless-stopped
