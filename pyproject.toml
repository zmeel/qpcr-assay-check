[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qpcr-assay-check"
version = "1.3.0"
description = "In silico re-evaluation of real-time PCR (TaqMan) assays against public NCBI data, with versioned, filed-as-a-record reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "qpcr-assay-check contributors" }]
keywords = ["qPCR", "TaqMan", "primer", "probe", "BLAST", "clinical microbiology", "assay evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
  "plotly>=6.0,<8",
  "primer3-py>=2.0,<3",
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
  "platformdirs>=4,<5",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]
structure = ["ViennaRNA>=2.6,<3"]

[project.scripts]
qpcr-assay-check = "qpcr_assay_check.cli:app"

[project.urls]
Homepage = "https://github.com/zmeel/qpcr-assay-check"
Repository = "https://github.com/zmeel/qpcr-assay-check"
Issues = "https://github.com/zmeel/qpcr-assay-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qpcr_assay_check"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "README.md", "CHANGELOG.md", "LICENSE", ".env.example"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: talks to the real NCBI servers; opt-in via --run-live, never run in CI",
]
