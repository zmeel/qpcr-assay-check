# Example assay: Influenza A, matrix (M) gene, one primer pair with two alternative NED probes.
#
# STATUS
#   Loci and channels format. One amplified region in the M gene (segment 7) with the supplied
#   reference sequence as its only reference, and both probes on one NED channel whose target is
#   the assay target (11320). Segment 7 is single-copy per genome, but every strain is its own
#   Nucleotide record, so the variant analysis works over records, not assemblies
#   (variants.source: blast_partitioned; see SCOPE below). Both probes are linear (NED/BHQ1, no
#   MGB or other Tm-raising modification), so the unmodified-probe ladder of R9 applies: one
#   mismatch outside the last 5 nt is tolerated, one in the last 5 nt or two anywhere is at
#   risk, three or more is likely failure (docs/MISMATCH_CLASSES.md). No wet-lab evidence
#   entries. No taxa inside influenza A are left out of the target.
#
# PROVENANCE
#   Oligos, reference sequence and the exclusion supplied by the user (2026-10-07); not checked
#   against a publication or kit insert. The sequences are added exactly as given, including the
#   discrepancy under WHAT WAS CHECKED. Oligo names are the user's.
#
# WHAT WAS CHECKED (2026-10-07, against the supplied reference sequence, 141 nt)
#   * FfluA at 1-23 exactly (its R matches the reference's A at position 6).
#   * PfluA1-tq-NED at 43-64 exactly, in the sense strand, 19 nt behind the forward primer.
#   * PfluA2-tq-NED binds the same site with one mismatch, 3 nt from its 3' end
#     (...CCGAGA -> ...CCGAAA): the alternative probe for that variant. It is absent from the
#     reference as supplied.
#   * RfluA: its binding site is at 118-139 (reverse complement) with TWO MISMATCHES, and the
#     reference runs on for 2 more nt. Aligned in full:
#         reference 118-141  CTCATGGAATGGCTAAAGACAAGA
#         RfluA, reversed    CTCATGGAARTGGCTAAAGAAGA-      (R = the Y of the primer)
#     The reference reads ...CTA AAG ACA AGA (Leu-Lys-Thr-Arg of M1), i.e. it carries two bases
#     more than the primer covers. Inserting GT after the primer's leading TCTT
#     (TCTTCTTTAGCC... -> TCTTGTCTTTAGCC...) makes the primer match the reference over its whole
#     length with no mismatch and no gap, which is consistent with two bases having been lost
#     when the primer was written down. THIS WAS NOT CHANGED HERE: the primer stands as supplied,
#     so a run will report a 2-base discrepancy at the 5' end of RfluA on essentially every
#     record. Confirm the primer against the laboratory's order sheet before reading a report of
#     this file.
#   * Taxonomy IDs verified live at NCBI on 2026-10-07: 11320 "Influenza A virus" (a no-rank node
#     under the species Alphainfluenzavirus influenzae, 2955291, so it covers every subtype and
#     strain below it) and 11520 "Influenza B virus".
#   * Template: RNA (influenza A is a negative-sense RNA virus), not stated by the user. The
#     annealing temperature and the human background search are the defaults (60 C, taxid 9606).
#
# SCOPE OF THE VARIANT ANALYSIS
#   Influenza A has 1,676,357 Nucleotide records (ESearch, 2026-10-07); the query below narrows
#   that to the 172,768 near-complete segment-7 records. Even so this is far more than one run
#   gets through: records are processed newest publication year first, up to
#   blast_max_records_per_run per run, and the run is resumed by running it again. A report
#   written before the listing is exhausted says so and is not a statement about the whole
#   population. Shrink the scope further with [PDAT] in nucleotide_query if only recent years
#   matter for the laboratory's question.

assay_name: Influenza A (matrix gene)
forward: {name: FfluA, sequence: CTTCTRACCGAGGTCGAAACGTA}       # R = A or G
reverse: {name: RfluA, sequence: TCTTCTTTAGCCAYTCCATGAG}        # Y = C or T
probe:
  - {name: PfluA1-tq-NED, sequence: TCAGGCCCCCTCAAAGCCGAGA, reporter: NED, quencher: BHQ1}
  - {name: PfluA2-tq-NED, sequence: TCAGGCCCCCTCAAAGCCGAAA, reporter: NED, quencher: BHQ1}
template_type: RNA
target:
  taxid: 11320                  # Influenza A virus (verified 2026-10-07)
  gene: matrix (M1/M2), segment 7
loci:
  - name: M gene region
    primers: [FfluA, RfluA]
    probes: [PfluA1-tq-NED, PfluA2-tq-NED]
    references:                 # the supplied reference sequence, as given (see WHAT WAS CHECKED)
      - name: fluA-M-fragment
        sequence: CTTCTAACCGAGGTCGAAACGTACGTTCTTTCTATCATCCCGTCAGGCCCCCTCAAAGCCGAGATCGCGCAGAGACTGGAAAGTGTCTTTGCAGGAAAGAACACAGATCTTGAGGCTCTCATGGAATGGCTAAAGACAAGA
channels:
  - {name: Influenza A, probes: [PfluA1-tq-NED, PfluA2-tq-NED]}  # reporter NED; target 11320
exclusivity_organisms:
  - Influenza B virus          # taxid 11520; outside influenza A, so a specificity search
oligo_source: Supplied by the user (2026-10-07); source publication or kit not stated.

settings:                      # only what differs from the defaults, for this assay
  variants:
    source: blast_partitioned  # segmented RNA virus: every Nucleotide record of segment 7
    nucleotide_query: "980:1100[SLEN] AND segment 7[TITL]"   # near-complete M segment
    blast_max_records_per_run: 5000   # 172,768 records listed: many runs (see SCOPE)
