# Example assay: Influenza A, matrix (M) gene, one primer pair with two alternative NED probes.
#
# STATUS
#   Loci and channels format. One amplified region in the M gene (segment 7) with the supplied
#   reference sequence as its only reference, and both probes on one NED channel whose target is
#   the assay target (11320). Segment 7 is single-copy per genome, but every strain is its own
#   Nucleotide record, so the variant analysis works over records, not assemblies
#   (variants.source: blast_partitioned; see SCOPE below). Both probes are linear (NED/BHQ1, no
#   MGB or other Tm-raising modification), so the unmodified-probe ladder of R9 applies: one
#   mismatch outside the last 5 nt is tolerated, one in the last 5 nt or two anywhere is at
#   risk, three or more is likely failure (docs/MISMATCH_CLASSES.md). No wet-lab evidence
#   entries. No taxa inside influenza A are left out of the target.
#
# PROVENANCE
#   Oligos, reference sequence and the exclusion passed on by the user (2026-10-07), who had
#   them from another laboratory to test this tool with; not checked against a publication or
#   kit insert. Oligo names are as received.
#   ONE SEQUENCE WAS CORRECTED, and only this one: the reverse primer arrived as the 22-mer
#   TCTTCTTTAGCCAYTCCATGAG, two bases short, and stands here as the user's own laboratory's
#   primer for the same influenza A PCR, TCTTGTCTTTAGCCAYTCCATGAG (the user, 2026-10-07: "in the
#   past we ran the same Influenza A PCR and our reverse primer is ..."). See REVERSE PRIMER
#   below for how the short form was found and what it did to the run of 13:08Z. Everything else
#   is exactly as received.
#
# WHAT WAS CHECKED (2026-10-07, against the supplied reference sequence, 141 nt)
#   * FfluA at 1-23 exactly (its R matches the reference's A at position 6).
#   * PfluA1-tq-NED at 43-64 exactly, in the sense strand, 19 nt behind the forward primer.
#   * PfluA2-tq-NED binds the same site with one mismatch at position 21 of 22, i.e. 2 nt from
#     its 3' end (...CCGAGA -> ...CCGAAA): the alternative probe for that variant. It is absent
#     from the reference as supplied.
#   * RfluA at 118-141 exactly (reverse complement; its Y matches the reference's T), so the
#     reference amplicon is the product: no flanking bases left over.
#   * Taxonomy IDs verified live at NCBI on 2026-10-07: 11320 "Influenza A virus" (a no-rank node
#     under the species Alphainfluenzavirus influenzae, 2955291, so it covers every subtype and
#     strain below it), and every name in exclusivity_organisms below, each resolving to exactly
#     one taxon by scientific name. Parainfluenza 1-3 and rhinovirus A are written with their
#     current scientific names: the older spellings resolve only through the [All Names] synonym
#     fallback.
#
# REVERSE PRIMER: WHY IT WAS CORRECTED (2026-10-07)
#   As received, RfluA was TCTTCTTTAGCCAYTCCATGAG (22 nt). Against the supplied reference its
#   site read two mismatches at the primer's 5' end and the reference ran on for 2 more bases:
#       reference 118-141     CTCATGGAATGGCTAAAGACAAGA
#       RfluA (22 nt), rev.   CTCATGGAARTGGCTAAAGAAGA-
#   The reference is in frame for M1 there (CTA AAG ACA AGA = Leu-Lys-Thr-Arg), so the primer,
#   not the reference, was out of register: inserting GT after its leading TCTT restores it.
#   The run of 2026-10-07T13:08Z showed the same thing in the data: all 23 reverse site variants,
#   over all 14,960 assessed records (100%), carried that 2-base difference, i.e. not one record
#   in 15,000 matched the primer perfectly. Checked live on two records the user downloaded
#   (PZ488030.1, PZ641704.1): the 22-mer gives 3 mismatches in both, the 24-mer gives 1, and the
#   one left is strain variation at a different position in each (3'-terminal G-T in PZ488030.1,
#   G-A at -3 in PZ641704.1). The forward primer and PfluA1 match both records exactly.
#   The user then gave their own laboratory's primer for the same PCR, which is the 24-mer, and
#   that is what stands above. What the 13:08Z report said under the 22-mer, for the record:
#   85.4% detectable and 13.0% likely failure of 12,848 records collected 2023-2026; 12,582
#   records (84.1%) were graded "tolerated" on the two phantom mismatches alone, and the 1,649
#   records (11.0%) with a real 3'-terminal G-A were "likely failure" (R1+R3b) where the lone
#   terminal mismatch is "at risk". Every reverse Tm was depressed by about 5.5 C, which is also
#   where that report's one hard QC failure (primer Tm difference 6.2 C) came from. Those numbers
#   describe the short primer, not this assay; rerun after clearing the cached regions.
#
# EXCLUSIVITY PANEL
#   The user asked for influenza B only; widened on advice and their go-ahead (2026-10-07).
#   An assay's own exclusivity_organisms REPLACES the packaged clinical organism list
#   (organisms.source: assay falls back to the global list only for an assay that defines none),
#   so a one-name list would have made this tier narrower than the default. Added: influenza C
#   and D, the nearest neighbours outside the target, each with its own M gene; and the
#   respiratory differential, which is what the tier is for - showing no product in the other
#   organisms the sample contains. Nothing INSIDE influenza A is excluded: avian and swine
#   strains sit under 11320 and detecting them is the point of an M-gene target.
#   * Template: RNA (influenza A is a negative-sense RNA virus), not stated by the user. The
#     annealing temperature and the human background search are the defaults (60 C, taxid 9606).
#
# SCOPE OF THE VARIANT ANALYSIS
#   Influenza A has 1,676,357 Nucleotide records (ESearch, 2026-10-07); the query below narrows
#   that to the 172,768 near-complete segment-7 records. Even so this is far more than one run
#   gets through: records are processed newest publication year first, up to
#   blast_max_records_per_run per run, and the run is resumed by running it again. A report
#   written before the listing is exhausted says so and is not a statement about the whole
#   population. Shrink the scope further with [PDAT] in nucleotide_query if only recent years
#   matter for the laboratory's question.

assay_name: Influenza A (matrix gene)
forward: {name: FfluA, sequence: CTTCTRACCGAGGTCGAAACGTA}       # R = A or G
reverse: {name: RfluA, sequence: TCTTGTCTTTAGCCAYTCCATGAG}      # Y = C or T; see REVERSE PRIMER
probe:
  - {name: PfluA1-tq-NED, sequence: TCAGGCCCCCTCAAAGCCGAGA, reporter: NED, quencher: BHQ1}
  - {name: PfluA2-tq-NED, sequence: TCAGGCCCCCTCAAAGCCGAAA, reporter: NED, quencher: BHQ1}
template_type: RNA
target:
  taxid: 11320                  # Influenza A virus (verified 2026-10-07)
  gene: matrix (M1/M2), segment 7
loci:
  - name: M gene region
    primers: [FfluA, RfluA]
    probes: [PfluA1-tq-NED, PfluA2-tq-NED]
    references:                 # the supplied reference sequence, as given (see WHAT WAS CHECKED)
      - name: fluA-M-fragment
        sequence: CTTCTAACCGAGGTCGAAACGTACGTTCTTTCTATCATCCCGTCAGGCCCCCTCAAAGCCGAGATCGCGCAGAGACTGGAAAGTGTCTTTGCAGGAAAGAACACAGATCTTGAGGCTCTCATGGAATGGCTAAAGACAAGA
channels:
  - {name: Influenza A, probes: [PfluA1-tq-NED, PfluA2-tq-NED]}  # reporter NED; target 11320
exclusivity_organisms:         # all taxa outside influenza A: a specificity search each
  # Orthomyxoviridae, the nearest neighbours of the target (own M gene; C infects humans)
  - Influenza B virus          # 11520, covers both the Victoria and Yamagata lineages
  - Influenza C virus          # 11552
  - Influenza D virus          # 1511084
  # The respiratory differential: what else is in the sample
  - Human respiratory syncytial virus   # 11250
  - Human metapneumovirus      # 162145
  - Human respirovirus 1       # 12730, formerly Human parainfluenza virus 1
  - Human orthorubulavirus 2   # 2560525, formerly Human parainfluenza virus 2
  - Human respirovirus 3       # 11216, formerly Human parainfluenza virus 3
  - Severe acute respiratory syndrome coronavirus 2   # 2697049
  - Human coronavirus 229E     # 11137
  - Human coronavirus OC43     # 31631
  - Human coronavirus NL63     # 277944
  - Human coronavirus HKU1     # 290028
  - Rhinovirus A               # 147711, formerly Human rhinovirus A
  - Enterovirus                # 12059, the genus
  - Mastadenovirus             # 10509, the genus (covers the human adenovirus species)
  - Human bocavirus 1          # 689403
oligo_source: Supplied by the user (2026-10-07); source publication or kit not stated.

settings:                      # only what differs from the defaults, for this assay
  variants:
    source: blast_partitioned  # segmented RNA virus: every Nucleotide record of segment 7
    nucleotide_query: "980:1100[SLEN] AND segment 7[TITL]"   # near-complete M segment
    blast_max_records_per_run: 5000   # 172,768 records listed: many runs (see SCOPE)
