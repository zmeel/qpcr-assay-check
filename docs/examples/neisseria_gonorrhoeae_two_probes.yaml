# Example assay: Neisseria gonorrhoeae, one primer pair with two alternative FAM-MGB probes.
#
# STATUS
#   Written in the PLANNED v1.3.0 format (named oligos, several per role; see
#   docs/FEATURE_IDEAS.md, "Several oligos per role"). The current tool (v1.2.0) accepts only one
#   sequence per role and will reject this file until v1.3.0 step 1 is implemented.
#
# PROVENANCE
#   Sequences supplied by the user (2026-09-24); not checked against a publication or kit insert.
#   Oligo names are placeholders; replace them with the laboratory's own.
#
# WHAT WAS CHECKED (2026-09-24)
#   * Against reference_amplicon below (76 nt): forward primer at 1-17, reverse primer binding site
#     at 53-76 (reverse complement), probe NG-P1 at 34-52 exactly. NG-P2 binds the same site with
#     5 mismatches in its 5' half: it is the alternative probe for a divergent variant.
#   * Live, on three RefSeq complete genomes of N. gonorrhoeae (taxid 485): NZ_CP145053.1,
#     NZ_CP145037.1, NZ_CP078119.1. The target is multi-copy (6-7 forward and 3-7 reverse primer
#     sites per genome; copies differ). NG-P1 matches exactly 2-4 times per genome; NG-P2 matches
#     exactly once in NZ_CP078119.1 and at best with 4 mismatches in the other two. The exact
#     76-nt reference_amplicon occurs 0, 3 and 2 times (both strands) in these genomes.
#   * Probe quencher: MGB probes were given as "FAM-MGB"; the quencher was not specified and is
#     left empty rather than guessed.
assay_name: Neisseria gonorrhoeae (two probes)
forward:
  name: NG-F
  sequence: GTTGAAACACCGCCCGG
reverse:
  name: NG-R
  sequence: CGGTTTGACCGGTTAAAAAAAGAT
probe:
  - name: NG-P1
    sequence: CCCTTCAACATCAGTGAAA
    reporter: FAM
    modifications: [MGB]
  - name: NG-P2
    sequence: CTTTGAACCATCAGTGAAA
    reporter: FAM
    modifications: [MGB]
template_type: DNA   # not stated by the user; DNA is the default for a bacterial target
target:
  taxid: 485
reference_amplicon: GTTGAAACACCGCCCGGAACCCGATATAATCCGCCCTTCAACATCAGTGAAAATCTTTTTTTAACCGGTCAAACCG
oligo_source: Supplied by the user; source publication or kit not stated.
