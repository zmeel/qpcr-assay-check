# Example assay: Neisseria gonorrhoeae, one primer pair with two alternative FAM-MGB probes.
#
# STATUS
#   Loci and channels format (overhaul of 2026-09-29; rewritten 2026-09-30, oligos, fragments,
#   target and settings unchanged). One amplified region with both fragments as references and
#   both probes; one FAM channel whose target is the assay target (485). The variant analysis
#   judges each genome by its best-binding copy of this multi-copy target. Both probes carry
#   MGB, so a single probe mismatch is "indeterminate" and two or more are "likely failure"
#   (docs/MISMATCH_CLASSES.md). No wet-lab evidence entries (user, 2026-09-30). No taxa inside
#   N. gonorrhoeae are left out of the target. Settings for this assay are at the end.
#
# NO CONTEXT ACCESSION
#   The region occurs 2-7 times per genome and the copies sit in different surroundings, so the
#   sequence either side of one copy does not describe the others. The fragments alone locate
#   the copies: the live run of 2026-09-29 found the region in 19,970 of 20,000 genomes, none
#   "not found", without a context accession.
#
# PROVENANCE
#   Sequences supplied by the user (2026-09-24); not checked against a publication or kit insert.
#   Oligo names are placeholders; replace them with the laboratory's own.
#
# WHAT WAS CHECKED (2026-09-24)
#   * Against the first fragment (NG-fragment-P1, 76 nt): forward primer at 1-17, reverse primer
#     binding site at 53-76 (reverse complement), probe NG-P1 at 34-52 exactly. NG-P2 binds the
#     same site with 5 mismatches in its 5' half: the alternative probe for a divergent variant.
#   * Live, on three RefSeq complete genomes of N. gonorrhoeae (taxid 485): NZ_CP145053.1,
#     NZ_CP145037.1, NZ_CP078119.1. The target is multi-copy (6-7 forward and 3-7 reverse primer
#     sites per genome; copies differ). NG-P1 matches exactly 2-4 times per genome; NG-P2 matches
#     exactly once in NZ_CP078119.1 and at best with 4 mismatches in the other two. The exact
#     76-nt NG-fragment-P1 occurs 0, 3 and 2 times (both strands) in these genomes.
#   * Second fragment (NG-fragment-P2, 79 nt; supplied as an alignment row with one '-', removed
#     here): forward primer at 1-17 exactly, NG-P2 at 35-53 exactly, NG-P1 absent. Its reverse
#     primer site differs from NG-fragment-P1: a poly-T run of 9 instead of 7 and one substitution
#     (GGTCAAACCG -> GGTTAAACCG), so NG-R can only bind it with a 2-base bulge and 1 mismatch, or
#     with mismatches at its 3' end. The NG-P2 copy in NZ_CP078119.1 (around 2133686) has yet
#     another reverse site: a poly-T run of 10 and GGTCAAACCG, i.e. no substitution. Poly-T length
#     differs between copies and strains (and homopolymer runs are prone to sequencing errors).
#   * Probe quencher: MGB probes were given as "FAM-MGB"; the quencher was not specified and is
#     left empty rather than guessed.
#   * Template: DNA (not stated by the user; DNA for a bacterial target). Exclusivity: N.
#     meningitidis, as in the user's first live run (taxid 487).

assay_name: Neisseria gonorrhoeae (two probes)
forward: {name: NG-F, sequence: GTTGAAACACCGCCCGG}
reverse: {name: NG-R, sequence: CGGTTTGACCGGTTAAAAAAAGAT}
probe:
  - {name: NG-P1, sequence: CCCTTCAACATCAGTGAAA, reporter: FAM, modifications: [MGB]}
  - {name: NG-P2, sequence: CTTTGAACCATCAGTGAAA, reporter: FAM, modifications: [MGB]}
template_type: DNA
target:
  taxid: 485                     # Neisseria gonorrhoeae
loci:
  - name: NG target region
    primers: [NG-F, NG-R]
    probes: [NG-P1, NG-P2]
    references:                  # both fragments as supplied (see WHAT WAS CHECKED)
      - {name: NG-fragment-P1, sequence: GTTGAAACACCGCCCGGAACCCGATATAATCCGCCCTTCAACATCAGTGAAAATCTTTTTTTAACCGGTCAAACCG}
      - {name: NG-fragment-P2, sequence: GTTGAAACACCGCCCGGAACCCGATATAATCCGCCTTTGAACCATCAGTGAAAATCTTTTTTTTTAACCGGTTAAACCG}
channels:
  - {name: N. gonorrhoeae, probes: [NG-P1, NG-P2]}   # reporter FAM (from the probes); target 485
exclusivity_organisms:
  - Neisseria meningitidis
oligo_source: Supplied by the user; source publication or kit not stated.

settings:                       # only what differs from the defaults, for this assay
  reaction:
    annealing_temp_C: 60        # this assay's cycling protocol
  search:
    background_taxids: [9606]   # human background search; [] skips it
  variants:
    source: datasets            # bacterium: every genome assembly
    homopolymer_bulges_detectable: false  # strict (the default): the poly-T length variants at
                                # the reverse site count as not detected; both counts are shown
