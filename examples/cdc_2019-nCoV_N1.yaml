# Example assay: CDC 2019-nCoV N1 (SARS-CoV-2, N gene), a published assay.
#
# SEQUENCE VERIFICATION
#   * Oligo provenance (checked 2026-09-20): the forward, reverse and probe sequences were
#     cross-checked against two independent open-access papers that quote the CDC N1 set as
#     ordered from IDT: PMC9115073 (forward, reverse, probe, with FAM and BHQ1 labels) and
#     PMC9758783 (reverse and probe). The CDC/FDA Instructions for Use (CDC-006-00019 Rev. 08) do
#     not print the oligo sequences, and the CDC package insert was not accessible.
#   * Match against the NCBI record (checked 2026-09-21 by scripts/smoke_test.py, live): all three
#     oligos match NC_045512.2 (Wuhan-Hu-1) exactly. Forward 28287-28306, probe 28309-28332 (same
#     strand as the forward primer), reverse primer binding site 28335-28358; the primer-defined
#     product is 28287-28358 = 72 bp, matching the published amplicon size (Lee et al. 2021,
#     PLoS ONE 16:e0260487). reference_amplicon below is that product, fetched from the record.
#     This shows the sequences occur in the reference genome; it does not show they are the ones
#     your laboratory orders. Verify against your own supplier documentation.
#   * NCBI Taxonomy ID 2697049 = Severe acute respiratory syndrome coronavirus 2 (NCBI Taxonomy
#     Browser, and the live E-utilities response of the same smoke test).
assay_name: CDC 2019-nCoV N1
forward: GACCCCAAAATCAGCGAAAT
reverse: TCTGGTTACTGCCAGTTGAATCTG
probe: ACCCCGCATTACGTTTGGTGGACC
probe_reporter: FAM
probe_quencher: BHQ1
probe_modifications: []
template_type: RNA
target:
  taxid: 2697049
  accession: NC_045512.2
  gene: N
reference_amplicon: GACCCCAAAATCAGCGAAATGCACCCCGCATTACGTTTGGTGGACCCTCAGATTCAACTGGCAGTAACCAGA
oligo_source: >-
  US CDC 2019-nCoV Real-Time RT-PCR Diagnostic Panel, N1 primer/probe set
  (2019-nCoV_N1-F, 2019-nCoV_N1-R, 2019-nCoV_N1-P).

# This assay's own settings (same structure as config.yaml; applied over the defaults and any
# --config file). A virus: the variant analysis uses Nucleotide records, restricted to
# genome-length records (SARS-CoV-2 genomes are about 29.9 kb).
settings:
  variants:
    source: blast_partitioned
    nucleotide_query: "25000:32000[SLEN]"
#  search: {background_taxids: []}   # to skip the human search, delete the '#' only
